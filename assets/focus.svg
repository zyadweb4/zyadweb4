<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-label="What I do: GIS and surveying, WordPress, web development, data entry, QA testing">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d2238"/><stop offset="1" stop-color="#081626"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#29B6F6" stop-opacity="0"/><stop offset=".5" stop-color="#4FC3F7"/><stop offset="1" stop-color="#29B6F6" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="3s" repeatCount="indefinite"/>
    </linearGradient>
    <style>
      .t{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
      .c{opacity:0;animation:up .8s cubic-bezier(.2,.8,.2,1) forwards}
      @keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
      .ic{fill:none;stroke:#4FC3F7;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:220;stroke-dashoffset:220;animation:draw 2.2s ease-out forwards, pulse 3s 2.4s ease-in-out infinite}
      @keyframes draw{to{stroke-dashoffset:0}}
      @keyframes pulse{50%{stroke:#FFFFFF}}
      .float{animation:float 4s ease-in-out infinite}
      @keyframes float{50%{transform:translateY(-5px)}}
      @media (prefers-reduced-motion: reduce){*{animation:none!important}.c{opacity:1}.ic{stroke-dashoffset:0}}
    </style>
  </defs>

  <!-- card template: 220 x 210, gap 25 -->
  <g class="c" style="animation-delay:.1s">
    <g class="float">
      <rect x="10" y="20" width="218" height="210" rx="16" fill="url(#card)" stroke="#29B6F6" stroke-opacity=".35"/>
      <rect x="30" y="20" width="178" height="2" fill="url(#edge)"/>
      <!-- map + pin -->
      <path class="ic" d="M60 70 l22-8 24 8 22-8v46l-22 8-24-8-22 8z M82 62v46 M106 70v46" style="animation-delay:.3s"/>
      <path class="ic" d="M160 64a12 12 0 0 1 24 0c0 10-12 22-12 22s-12-12-12-22z" style="animation-delay:.6s"/>
      <text x="30" y="160" class="t" font-size="20" font-weight="700" fill="#FFFFFF">GIS &amp; Surveying</text>
      <text x="30" y="186" class="t" font-size="13" fill="#9fcbe3">ArcGIS Pro · QGIS</text>
      <text x="30" y="205" class="t" font-size="13" fill="#9fcbe3">AutoCAD · Civil 3D</text>
    </g>
  </g>

  <g class="c" style="animation-delay:.35s">
    <g class="float" style="animation-delay:.6s">
      <rect x="248" y="20" width="218" height="210" rx="16" fill="url(#card)" stroke="#29B6F6" stroke-opacity=".35"/>
      <rect x="268" y="20" width="178" height="2" fill="url(#edge)"/>
      <!-- W in circle -->
      <circle class="ic" cx="357" cy="84" r="30" style="animation-delay:.5s"/>
      <path class="ic" d="M337 72l8 26 12-22 12 22 8-26" style="animation-delay:.9s"/>
      <text x="268" y="160" class="t" font-size="20" font-weight="700" fill="#FFFFFF">WordPress</text>
      <text x="268" y="186" class="t" font-size="13" fill="#9fcbe3">Elementor · WooCommerce</text>
      <text x="268" y="205" class="t" font-size="13" fill="#9fcbe3">SEO · security · hosting</text>
    </g>
  </g>

  <g class="c" style="animation-delay:.6s">
    <g class="float" style="animation-delay:1.2s">
      <rect x="486" y="20" width="218" height="210" rx="16" fill="url(#card)" stroke="#29B6F6" stroke-opacity=".35"/>
      <rect x="506" y="20" width="178" height="2" fill="url(#edge)"/>
      <!-- code brackets -->
      <path class="ic" d="M565 62l-22 22 22 22 M625 62l22 22-22 22 M605 56l-20 56" style="animation-delay:.8s"/>
      <text x="506" y="160" class="t" font-size="20" font-weight="700" fill="#FFFFFF">Web Developer</text>
      <text x="506" y="186" class="t" font-size="13" fill="#9fcbe3">HTML · CSS · JavaScript</text>
      <text x="506" y="205" class="t" font-size="13" fill="#9fcbe3">PHP · Flutter</text>
    </g>
  </g>

  <g class="c" style="animation-delay:.85s">
    <g class="float" style="animation-delay:1.8s">
      <rect x="724" y="20" width="218" height="210" rx="16" fill="url(#card)" stroke="#29B6F6" stroke-opacity=".35"/>
      <rect x="744" y="20" width="178" height="2" fill="url(#edge)"/>
      <!-- table / sheet -->
      <path class="ic" d="M793 56h70v58h-70z M793 75h70 M793 95h70 M816 56v58 M840 56v58" style="animation-delay:1.1s"/>
      <text x="744" y="160" class="t" font-size="20" font-weight="700" fill="#FFFFFF">Data Entry</text>
      <text x="744" y="186" class="t" font-size="13" fill="#9fcbe3">Excel · Power BI · SQL</text>
      <text x="744" y="205" class="t" font-size="13" fill="#9fcbe3">Arabic &amp; English, accurate</text>
    </g>
  </g>

  <g class="c" style="animation-delay:1.1s">
    <g class="float" style="animation-delay:2.4s">
      <rect x="962" y="20" width="218" height="210" rx="16" fill="url(#card)" stroke="#29B6F6" stroke-opacity=".35"/>
      <rect x="982" y="20" width="178" height="2" fill="url(#edge)"/>
      <!-- check in shield -->
      <path class="ic" d="M1071 52l30 12v22c0 20-14 32-30 38-16-6-30-18-30-38V64z" style="animation-delay:1.4s"/>
      <path class="ic" d="M1058 86l10 10 18-20" style="animation-delay:1.9s"/>
      <text x="982" y="160" class="t" font-size="20" font-weight="700" fill="#FFFFFF">QA Testing</text>
      <text x="982" y="186" class="t" font-size="13" fill="#9fcbe3">Manual · Playwright</text>
      <text x="982" y="205" class="t" font-size="13" fill="#9fcbe3">Jira · web &amp; mobile</text>
    </g>
  </g>
</svg>
