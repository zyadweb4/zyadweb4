<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="24" viewBox="0 0 1200 24" role="img" aria-label="">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#29B6F6" stop-opacity="0"/>
      <stop offset=".5" stop-color="#4FC3F7"/>
      <stop offset="1" stop-color="#29B6F6" stop-opacity="0"/>
    </linearGradient>
    <style>
      .dot{animation:run 4s linear infinite}
      @keyframes run{from{transform:translateX(0)}to{transform:translateX(1200px)}}
      @media (prefers-reduced-motion: reduce){.dot{animation:none}}
    </style>
  </defs>
  <rect x="0" y="11" width="1200" height="2" fill="url(#g)" opacity=".5"/>
  <g class="dot">
    <rect x="-160" y="11" width="160" height="2" fill="url(#g)"/>
    <circle cx="0" cy="12" r="4" fill="#FFFFFF"/>
    <circle cx="0" cy="12" r="8" fill="#29B6F6" opacity=".35"/>
  </g>
</svg>
